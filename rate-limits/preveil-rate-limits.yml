note: >-
  No published rate limits, and none expected: PreVeil has no public API to
  limit. The only documented quantitative limits are per-plan storage quotas
  (5 GB Basic, 5 TB Individual, 10 TB Business and Gov Community), which are
  recorded in plans/preveil-plans-pricing.yml rather than here. One access
  control that is documented is IP allow-listing — an organization can restrict
  which IP addresses may reach PreVeil, and a blocked address gets an
  "<IP address> not permitted to access PreVeil" error — but that is a policy
  gate, not a rate limit. No X-RateLimit-*, RateLimit-* or Retry-After header
  practice is published.
