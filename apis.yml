aid: preveil
name: PreVeil
description: >-
  PreVeil is a Boston-based end-to-end encrypted email and file-sharing platform
  built for organizations that must protect Controlled Unclassified Information
  (CUI) and meet CMMC 2.0 Level 2, DFARS 252.204-7012, ITAR, NIST SP 800-171,
  HIPAA and GDPR obligations. Its architecture removes the central point of
  compromise: every message and file is encrypted on the endpoint with per-user
  keys the service never holds, privileged administrative actions require
  multi-party cryptographic consent through Approval Groups, and there are no
  passwords to phish. The platform ships PreVeil Drive (encrypted file sharing
  and sync through Windows Explorer, Mac Finder or a browser), PreVeil Email
  (which layers onto existing Outlook, Apple Mail and Gmail clients), PreVeil
  Express for free browser-based external collaboration, an Admin Console with
  tamper-proof activity logging, e-discovery and device management, a licensed
  SIEM Connector appliance that exports those logs in syslog format, and a
  Compliance Accelerator and GRC platform for CMMC documentation. PreVeil
  publishes no public developer API, SDK or OpenAPI definition; its documented
  programmatic surface is the first-party PreVeil Drive Upload command-line
  tool and the SIEM Connector.
