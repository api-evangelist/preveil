  reason: no-developer-program
  detail: >-
    PreVeil ships end-user encrypted email and file-sharing clients and publishes
    no developer program at all — there is no api./developer./docs. host in DNS,
    /openapi.json and every /.well-known/ path 404 on www.preveil.com, the
    web.preveil.com SPA answers 200 with an HTML shell for every path including
    /openapi.json and /.well-known/agent-card.json, and a full-text search of
    PreVeil's own Confluence knowledge base for "API" returns one hit that is an
    Android API-level requirement; the only documented programmatic surfaces are
    a bundled Drive Upload CLI that talks to a machine-local daemon and a
    licensed SIEM Connector appliance that exports logs as syslog.
